                    - generic [ref=f52e165]:
                      - text: "New York University Tandon School of Engineering Computer Science and Engineering Department CS - UY 11 3 4 : Data Structures and Algorithms Fall 20 2 6 A LEC Mon, Wed 11 : 0 0am to 1 2 : 2 0 p m B LEC Mon, Wed 12 :30 p m to 1 :50 p m C LEC Mon, Wed 3 :30 p m to 4 :50 p m C ontact Information Professor Tal: itay.tal@nyu.edu , 370 Jay Street , 8th floor , room 865 Office Hours Professor Tal: B y appointment , schedule using the following link: https://calendly.com/it13 -"
                      - generic [ref=f52e167]: nyu/cs
                      - text: "- 1134 - office - hour - with - prof - tal Course Prerequisites CS - UY 1114 with a C - grade or better Course Description This course covers abstra ct data types and the implemen tation and use of standard data structures along with fundamental algorithms and the basics of algorithm analysis. Course Objectives At the completio n of this course a student will: 1. Be familiar with basic techniques of algorithm analysis 2. Be able to design and analyze recursive algorithm s 3. Be familiar with fundamental data structures, their implementation and performance: dynamic arrays, stacks and queues 4. Master the implementation of linked data structures such as linked lists and binary trees 5. Be familiar with advanced data structures such as search trees, hash tables, priority queues and graphs 6. Have a practical un derstanding of the concepts of d ata abstraction. 7. Be familiar with several searching an d sorting algorithms including insertion - sort , merge - sort and heap - sort Course Structure Most of the material will be presented in lectures. Re ading assignments from the text book , programming and other exercises in the lab, and weekly homework assignments will reinforce this material . You should expect to spend a substantial time outside the class working on the homework assignments. Assignments and other important announcements will be posted on NYU Brightspace . You should check the course page every day and sign up for e - mail notification of announcements ."
                    - generic:
                      - link "mailto:itay.tal@nyu.edu" [ref=f52e169] [cursor=pointer]:
                        - /url: mailto:itay.tal@nyu.edu
                      - link "https://calendly.com/it13-nyu/cs-1134-office-hour-with-prof-tal" [ref=f52e171] [cursor=pointer]:
                        - /url: https://calendly.com/it13-nyu/cs-1134-office-hour-with-prof-tal
                  - region "Page ⁨2⁩" [ref=f52e172]:
                    - generic [ref=f52e174]: "Readings The text book for the course is: Data Structures and Algorithms in Python ,1 st Edition , Michael T. Goodrich, Roberto Tamassia, Michael H. Goldwasser. ISBN - 13: 978 - 1118290279. ISBN - 10: 1118290275. There is also an electronic v ersion of the textbook, which is less expensive. Copies are available in the NYU bookstore, as well as other book vendors. Several copies are on reserve in the Dibner Library. Course requirements • Tests: There will be two midterm exam s and a final exam. These exams will include some short answer, as well as programming problems. • Homework assignments : W ill reinforce the material covered in the lectures and in the text book. Although these count for a relatively small percentage of your grade, it is essential that you do them and understand the solutions. It is unlikely that you will do well on the exams if you do not understand how to solve problems like the homework exercises. • Lab s : Y ou are expected to come on time to all labs , complete the required work, and help others if you finish early. You r lab grade will mostly reflect the effort you made to solve the problems during the lab time . Lab makeup policy : Two unexcused lab absences are allowed. All other absences must be validated by Student Advocacy. To receive credit for a missed lab — whether the absence was excused or not — you must: • Work on the missed lab on your own time • Get it checked by a TA at office hours within one week of the missed lab Gradin g Grades will be computed roughly as follows (We may tweak the formula a little): • 35% – Exam with highest grade • 25% – Exam with second highest grade • 15% – Exam with lowest grade • 10% – Homework • 15% – Lab grade Important Dates Tue 9/2: Fall 2026 Classes Begin Mon 9/7: Labor Day, No Class Mon 10/12: Fall Break, No Class Wed 10/14: Legislative Monday - Classes will meet according to a Monday schedule Tue 10/27: Midterm 1 Tue 11/24: Midterm 2 11/26 – 11/27: Thanksgiving Recess, No Class Mon 12/14: Last Day of Fall 2026 Classes 12/16 – 12/22: Fall Semester Exams. The final exam could be any time during this week."
