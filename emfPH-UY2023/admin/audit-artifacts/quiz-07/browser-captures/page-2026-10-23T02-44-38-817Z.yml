                      - generic [ref=f58e2154]: Tutorial Exercise
                      - generic [ref=f58e2156]:
                        - text: A small, rigid object carries positive and negative 4.50-nC charges. It is oriented so that the positive charge has coordinates (−1.20 mm, 1.70 mm) and the negative charge is at the point (1.80 mm, −1.30 mm).
                        - generic [ref=f58e2157]:
                          - text: (a) Find the electric dipole moment of the object. The object is placed in an electric field
                          - generic [ref=f58e2160]:
                            - generic [ref=f58e2161]: E
                            - text: = (
                            - generic [ref=f58e2164]:
                              - text: 7.80 10
                              - superscript [ref=f58e2166]: "3"
                            - text: î −
                            - generic [ref=f58e2167]:
                              - text: 4.90 10
                              - superscript [ref=f58e2169]: "3"
                            - text: ĵ) N/C.
                          - text: (b) Find the torque acting on the object. (c) Find the potential energy of the object–field system when the object is in this orientation. (d) Assuming the orientation of the object can change, find the difference between the maximum and the minimum potential energies of the system.
                    - generic [ref=f58e2170]:
                      - generic [ref=f58e2171]: Part 1 of 8 - Conceptualize
                      - generic [ref=f58e2174]:
                        - text: An electric dipole in an external electric field behaves like a needle mounted at its midpoint on a vertical pivot. The dipole can be forced to another orientation by exerting a torque on it to move it from its position of lowest energy. When released, it will oscillate like a torsional pendulum. The electric dipole in this problem is small in size like one that might be used in a classroom experiment. The dipole moment will be in the picocoulomb-meter range and the torque, which tends to turn it clockwise to align it with the field, will be on the order of a few nanonewton-meters, with the potential energy on the order of nanojoules. In the orientation described, the dipole is close to its maximum potential energy since its moment is close to being opposite the field direction.
                        - figure [ref=f58e2175]:
                          - text: ℹ
                          - generic [ref=f58e2177]:
