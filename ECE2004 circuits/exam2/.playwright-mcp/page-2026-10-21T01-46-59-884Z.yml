      - article [ref=f1e94]:
        - generic [ref=f1e95]:
          - heading "Set 5 — Supermesh Analysis" [level=2] [ref=f1e96]
          - paragraph [ref=f1e97]: Twenty worked problems on the one configuration that ordinary mesh analysis cannot handle. A current source in a branch shared by two meshes has a terminal voltage that no combination of mesh currents can express, so neither mesh's KVL equation can be written. The remedy is to write one equation round a path that avoids the source, and to recover the missing equation from the source's own current.
          - paragraph [ref=f1e98]: Textbook Chapter 3 · 20 solved · 12 practice · 3 challenge · 12 MCQs
        - generic [ref=f1e100]:
          - generic [ref=f1e101]:
            - generic [ref=f1e102]: i
            - text: Method Recap
          - list [ref=f1e103]:
            - listitem [ref=f1e104]:
              - paragraph [ref=f1e105]:
                - strong [ref=f1e106]: Recognise the trigger.
                - text: A supermesh is needed only when a current source lies in a branch
                - emphasis [ref=f1e107]: shared
                - text: by two meshes. A source on the outer periphery belongs to one mesh alone and simply fixes that mesh current.
            - listitem [ref=f1e108]:
              - paragraph [ref=f1e109]:
                - strong [ref=f1e110]: Draw the supermesh boundary.
                - text: Take the outer perimeter of the two meshes, excluding the branch containing the source. Write one KVL equation round that path. The source's unknown voltage never appears, because the path never crosses it.
            - listitem [ref=f1e111]:
              - paragraph [ref=f1e112]:
                - strong [ref=f1e113]: Add the constraint.
                - text: "One equation has been lost, and the source itself replaces it:"
