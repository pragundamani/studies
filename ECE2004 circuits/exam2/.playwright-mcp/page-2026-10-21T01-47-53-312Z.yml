                      - generic [ref=f2e151]: s
                - text: ", with the sign fixed by the source's arrow relative to the two mesh directions. Getting this sign wrong is the commonest failure in the whole topic."
            - listitem [ref=f2e152]:
              - paragraph [ref=f2e153]:
                - strong [ref=f2e154]: Resistors inside the excluded branch are invisible
                - text: to the supermesh equation. They still dissipate power, and they still affect the source's terminal voltage — but they have no effect whatsoever on the mesh currents.
            - listitem [ref=f2e155]:
              - paragraph [ref=f2e156]:
                - strong [ref=f2e157]: Recover the source voltage last.
                - text: Once all mesh currents are known, apply KVL to either of the original meshes; the source voltage is then the only unknown left.
            - listitem [ref=f2e158]:
              - paragraph [ref=f2e159]:
                - strong [ref=f2e160]: Chained sources merge further.
                - text: If mesh 2 is joined to mesh 1 by one source and to mesh 3 by another, all three collapse into a single supermesh with two constraints. The equation count always works out.
