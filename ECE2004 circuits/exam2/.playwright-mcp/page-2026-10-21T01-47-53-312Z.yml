            - generic [ref=f2e16721]: Diagnostics
            - heading "Common Mistakes" [level=2] [ref=f2e16722]
          - list [ref=f2e16724]:
            - listitem [ref=f2e16725]:
              - paragraph [ref=f2e16726]:
                - strong [ref=f2e16727]: Getting the constraint sign backwards.
                - text: Read the source arrow against each mesh's clockwise traverse of that branch. Problem 9 shows that the wrong sign gives a completely different — and completely self-consistent-looking — answer.
            - listitem [ref=f2e16728]:
              - paragraph [ref=f2e16729]:
                - strong [ref=f2e16730]: Forgetting the constraint altogether.
                - text: The supermesh gives one equation where two were expected. Without the source's own current you are one equation short and the system will not close.
            - listitem [ref=f2e16731]:
              - paragraph [ref=f2e16732]:
                - strong [ref=f2e16733]: Including elements from the excluded branch in the supermesh equation.
                - text: The path avoids the entire branch, resistors and all — Problem 6.
            - listitem [ref=f2e16734]:
              - paragraph [ref=f2e16735]:
                - strong [ref=f2e16736]: Assuming the excluded resistor does nothing.
                - text: It carries the full source current and can dissipate more power than the rest of the circuit combined.
            - listitem [ref=f2e16737]:
              - paragraph [ref=f2e16738]:
                - strong [ref=f2e16739]: Writing a mesh KVL that contains the current source's voltage as an unknown.
                - text: That adds an unknown for every equation gained and makes no progress. Do it only at the end, to recover
                - generic [ref=f2e16741]:
                  - generic [ref=f2e16743]:
                    - generic [ref=f2e16744]: V
                    - generic [ref=f2e16747]:
                      - generic [ref=f2e16748]: c
                      - generic [ref=f2e16750]: s
                  - math [ref=f2e16753]:
                    - generic [ref=f2e16754]:
                      - generic [ref=f2e16755]: V
                      - generic [ref=f2e16756]:
                        - generic [ref=f2e16757]: c
                        - generic [ref=f2e16758]: s
                - text: .
            - listitem [ref=f2e16759]:
              - paragraph [ref=f2e16760]:
                - strong [ref=f2e16761]: Forming a supermesh for a peripheral current source.
                - text: Unnecessary, and it will leave you one equation short. Check whether the branch is really shared.
            - listitem [ref=f2e16762]:
              - paragraph [ref=f2e16763]:
                - strong [ref=f2e16764]: Treating overlapping supermeshes as nested.
                - text: They merge into a single region with one KVL equation — Problem 16.
            - listitem [ref=f2e16765]:
              - paragraph [ref=f2e16766]:
                - strong [ref=f2e16767]: Assuming the current source delivers power.
                - text: It frequently absorbs. Compute the terminal voltage and check which terminal the current enters.
            - listitem [ref=f2e16768]:
              - paragraph [ref=f2e16769]:
                - strong [ref=f2e16770]: Quoting a source power without stating the convention.
                - generic [ref=f2e16772]:
                  - generic [aria-hidden] [ref=f2e16773]:
                    - generic [ref=f2e16774]: P
                    - generic [ref=f2e16776]: =
                    - generic [ref=f2e16778]: −
                    - generic [ref=f2e16780]:
                      - generic [ref=f2e16781]: "4"
                      - generic [ref=f2e16782]: "9"
                    - generic [ref=f2e16783]: W
                  - math [ref=f2e16786]:
                    - generic [ref=f2e16787]: P
                    - generic [ref=f2e16788]: =
                    - generic [ref=f2e16789]: −
                    - generic [ref=f2e16790]: "49"
                    - generic [ref=f2e16791]: W
                - text: under the passive sign convention and "49 W delivered" are the same claim; an unqualified "49 W" is not.
            - listitem [ref=f2e16792]:
              - paragraph [ref=f2e16793]:
                - strong [ref=f2e16794]: Reaching for a supermesh before checking for a parallel resistance.
                - text: A source transformation is usually quicker and restores the symmetric resistance matrix — Problem 18.
        - generic [ref=f2e16795]:
          - generic [ref=f2e16796]: Looking Ahead
          - paragraph [ref=f2e16797]: "With the supermesh in hand, mesh analysis is complete: every planar circuit, with any combination of independent and dependent sources of either type, can now be solved. The remaining limitations are structural rather than procedural — non-planar circuits have no meshes at all, and a circuit rich in voltage sources produces a larger system than it needs to."
          - paragraph [ref=f2e16798]:
            - text: Sets 6 and 7 rebuild the whole method from the other side. Nodal analysis chooses node voltages, so KVL is satisfied automatically and only KCL need be written —
            - generic [ref=f2e16800]:
              - generic [aria-hidden] [ref=f2e16801]:
                - generic [ref=f2e16802]: "n"
                - generic [ref=f2e16804]: −
                - generic [ref=f2e16806]: "1"
              - math [ref=f2e16809]:
                - generic [ref=f2e16810]: "n"
                - generic [ref=f2e16811]: −
                - generic [ref=f2e16812]: "1"
            - text: equations, on any circuit whatever. There the awkward element is the
            - emphasis [ref=f2e16813]: voltage
            - text: "source between two non-reference nodes, whose current cannot be written in terms of node voltages, and the remedy is the supernode: enclose both nodes in a surface, apply KCL to it, and recover the missing equation from the source's own voltage. Every sentence of this set has an exact counterpart there, with current and voltage interchanged."
