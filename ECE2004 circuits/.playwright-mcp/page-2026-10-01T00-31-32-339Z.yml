            - heading "Kirchhoff’s Current Law (KCL)" [level=1] [ref=e219]
            - separator [ref=e220]
            - separator [ref=e221]
            - generic [ref=e222]:
              - heading "What Is Kirchhoff’s Current Law?" [level=3] [ref=e223]
              - paragraph [ref=e224]: Kirchhoff’s Current Law, often shortened to KCL, states that “The algebraic sum of all currents entering and exiting a node must equal zero.”
              - paragraph [ref=e225]: This law is used to describe how a charge enters and leaves a wire junction point or node on a wire.
              - paragraph [ref=e226]: Armed with this information, let’s now take a look at an example of the law in practice, why it’s important, and how it was derived.
              - heading "Parallel Circuit Review" [level=3] [ref=e227]
              - paragraph [ref=e228]: "Let’s take a closer look at that last parallel example circuit:"
              - paragraph [ref=e229]:
                - img "parallel circuit example" [ref=e230]
              - paragraph [ref=e231]: "Solving for all values of voltage and current in this circuit:"
              - paragraph [ref=e232]:
                - img "voltage current values" [ref=e233]
              - paragraph [ref=e234]:
                - text: At this point, we know the value of each branch current and of the total current in the circuit. We know that the total current in a
                - link "parallel circuit" [ref=e235] [cursor=pointer]:
                  - /url: https://www.allaboutcircuits.com/video-lectures/parallel-circuits/
                - text: "must equal the sum of the branch currents, but there’s more going on in this circuit than just that. Taking a look at the currents at each wire junction point (node) in the circuit, we should be able to see something else:"
              - paragraph [ref=e236]:
                - img "parallel circuit example 2" [ref=e237]
              - paragraph [ref=e238]
              - heading "Currents Entering and Exiting a Node" [level=3] [ref=e239]
              - paragraph [ref=e240]:
                - text: At each node on the positive “rail” (wire 1-2-3-4) we have current splitting off the main flow to each successive branch resistor. At each node on the negative “rail” (wire 8-7-6-5) we have current merging together to form the main flow from each successive branch
                - link "resistor" [ref=e241] [cursor=pointer]:
                  - /url: https://www.allaboutcircuits.com/video-lectures/electronic-components-resistors/
                - text: . This fact should be fairly obvious if you think of the water pipe circuit analogy with every branch node acting as a “tee” fitting, the water flow splitting or merging with the main piping as it travels from the output of the water pump toward the return reservoir or sump.
              - paragraph [ref=e242]: "If we were to take a closer look at one particular “tee” node, such as node 6, we see that the current entering the node is equal in magnitude to the current exiting the node:"
              - paragraph [ref=e243]:
                - img "tee node" [ref=e244]
              - paragraph [ref=e245]: "From the top and from the right, we have two currents entering the wire connection labeled as node 6. To the left, we have a single current exiting the node equal in magnitude to the sum of the two currents entering. To refer to the plumbing analogy: so long as there are no leaks in the piping, what flow enters the fitting must also exit the fitting. This holds true for any node (“fitting”), no matter how many flows are entering or exiting. Mathematically, we can express this general relationship as such:"
              - paragraph [ref=e246]:
                - img "exiting equals entering" [ref=e247]
              - paragraph [ref=e248]
              - heading "Kirchhoff’s Current Law" [level=3] [ref=e249]
              - paragraph [ref=e250]:
                - text: Mr. Kirchhoff decided to express it in a slightly different form (though mathematically equivalent), calling it
                - emphasis [ref=e251]: Kirchhoff’s Current Law
                - text: "(KCL):"
              - paragraph [ref=e252]
              - paragraph [ref=e253]:
                - img "kirchhoffs current law" [ref=e254]
              - paragraph [ref=e255]
              - paragraph [ref=e256]: "Summarized in a phrase, Kirchhoff’s Current Law reads as such:"
              - paragraph [ref=e257]:
                - strong [ref=e258]:
                  - emphasis [ref=e259]: “The algebraic sum of all currents entering and exiting a node must equal zero”
              - paragraph [ref=e260]: That is, if we assign a mathematical sign (polarity) to each current, denoting whether they enter (+) or exit (-) a node, we can add them together to arrive at a total of zero, guaranteed.
              - paragraph [ref=e261]: "Taking our example node (number 6), we can determine the magnitude of the current exiting from the left by setting up a KCL equation with that current as the unknown value:"
              - paragraph [ref=e262]:
                - img "algebraic sum of all currents" [ref=e263]
              - paragraph [ref=e264]
              - paragraph [ref=e265]:
                - text: The negative (-) sign on the value of 5 milliamps tells us that the current is
                - emphasis [ref=e266]: exiting
                - text: the node, as opposed to the 2 milliamp and 3 milliamp currents, which must both be positive (and therefore
                - emphasis [ref=e267]: entering
                - text: the node). Whether negative or positive denotes current entering or exiting is entirely arbitrary, so long as they are opposite signs for opposite directions and we stay consistent in our notation, KCL will work.
              - paragraph [ref=e268]:
                - text: Together, Kirchhoff’s Voltage and Current Laws are a formidable pair of tools useful in analyzing electric circuits. Their usefulness will become all the more apparent in a later chapter (“
                - link "Network Analysis" [ref=e269] [cursor=pointer]:
                  - /url: https://www.allaboutcircuits.com/textbook/direct-current/chpt-10/what-is-network-analysis/
                - text: ”), but suffice it to say that these Laws deserve to be memorized by the electronics student every bit as much as
                - link "Ohm’s Law" [ref=e270] [cursor=pointer]:
                  - /url: https://www.allaboutcircuits.com/video-lectures/electrical-quantities-b/
                - text: .
              - paragraph [ref=e271]:
                - strong [ref=e272]: "REVIEW:"
              - list [ref=e273]:
                - listitem [ref=e274]:
                  - text: "Kirchhoff’s Current Law (KCL):"
                  - emphasis [ref=e275]: “The algebraic sum of all currents entering and exiting a node must equal zero”
              - paragraph [ref=e276]:
