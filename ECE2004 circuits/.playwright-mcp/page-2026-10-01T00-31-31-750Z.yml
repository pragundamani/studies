            - heading "Kirchhoff’s Voltage Law (KVL)" [level=1] [ref=e210]
            - separator [ref=e211]
            - separator [ref=e212]
            - generic [ref=e213]:
              - heading "What is Kirchhoff’s Voltage Law (KVL)?" [level=3] [ref=e214]
              - paragraph [ref=e215]:
                - text: The principle known as
                - emphasis [ref=e216]: Kirchhoff’s Voltage Law
                - text: "(discovered in 1847 by Gustav R. Kirchhoff, a German physicist) can be stated as such:"
              - paragraph [ref=e217]:
                - strong [ref=e218]:
                  - emphasis [ref=e219]: “The algebraic sum of all voltages in a loop must equal zero”
              - paragraph [ref=e220]:
                - text: By
                - emphasis [ref=e221]: algebraic
                - text: ", I mean accounting for signs (polarities) as well as magnitudes. By"
                - emphasis [ref=e222]: loop
                - text: ", I mean any path traced from one point in a circuit around to other points in that circuit, and finally back to the initial point."
              - heading "Demonstrating Kirchhoff’s Voltage Law in a Series Circuit" [level=3] [ref=e223]
              - paragraph [ref=e224]: "Let’s take another look at our example series circuit, this time numbering the points in the circuit for voltage reference:"
              - paragraph [ref=e225]:
                - img "kirchoffs voltage law in series circuit" [ref=e226]
              - paragraph [ref=e227]: "If we were to connect a voltmeter between points 2 and 1, red test lead to point 2 and the black test lead to point 1, the meter would register +45 volts. Typically the “+” sign is not shown but rather implied, for positive readings in digital meter displays. However, for this lesson, the polarity of the voltage reading is very important and so I will show positive numbers explicitly:"
              - paragraph [ref=e228]:
                - img "voltage reading polarity equation" [ref=e229]
              - paragraph [ref=e230]:
                - text: When a voltage is specified with a double subscript (the characters “2-1” in the notation “E
                - subscript [ref=e231]: 2-1
                - text: ”), it means the voltage at the first point (2) as measured in reference to the second point (1). A voltage specified as “E
                - subscript [ref=e232]: cd
                - text: "” would mean the voltage as indicated by a digital meter with the red test lead on point “c” and the black test lead on point “d”: the voltage at “c” in reference to “d”."
              - paragraph [ref=e233]:
                - img "the meaning of eed" [ref=e234]
              - paragraph [ref=e235]:
                - text: If we were to take that same voltmeter and measure the voltage drop across each
                - link "resistor" [ref=e236] [cursor=pointer]:
                  - /url: https://www.allaboutcircuits.com/video-lectures/electronic-components-resistors/
                - text: ", stepping around the circuit in a clockwise direction with the red test lead of our meter on the point ahead and the black test lead on the point behind, we would obtain the following readings:"
              - paragraph [ref=e237]
              - paragraph [ref=e238]:
                - img "measuring voltage drop" [ref=e239]
              - paragraph [ref=e240]:
                - img "kirchoffs voltage law diagram 1" [ref=e241]
              - paragraph [ref=e242]:
                - text: We should already be familiar with the general principle for
                - link "series circuits" [ref=e243] [cursor=pointer]:
                  - /url: https://www.allaboutcircuits.com/video-lectures/series-circuits-part-1/
                - text: "stating that individual voltage drops add up to the total applied voltage, but measuring voltage drops in this manner and paying attention to the polarity (mathematical sign) of the readings reveals another facet of this principle: that the voltages measured as such all add up to zero:"
              - paragraph [ref=e244]
              - paragraph [ref=e245]:
                - img "general principle for series circuits diagram 1" [ref=e246]
              - paragraph [ref=e247]
              - paragraph [ref=e248]: "In the above example, the loop was formed by the following points in this order: 1-2-3-4-1. It doesn’t matter which point we start at or which direction we proceed in tracing the loop; the voltage sum will still equal zero. To demonstrate, we can tally up the voltages in loop 3-2-1-4-3 of the same circuit:"
              - paragraph [ref=e249]
              - paragraph [ref=e250]:
                - img "general principle for series circuits diagram 2" [ref=e251]
              - paragraph [ref=e252]
              - paragraph [ref=e253]: "This may make more sense if we re-draw our example series circuit so that all components are represented in a straight line:"
              - paragraph [ref=e254]
              - paragraph [ref=e255]
              - paragraph [ref=e256]
              - paragraph [ref=e257]:
                - text: "It’s still the same series circuit, just with the components arranged in a different form. Notice the polarities of the resistor voltage drops with respect to the battery: the battery’s voltage is negative on the left and positive on the right, whereas all the resistor voltage drops are oriented the other way: positive on the left and negative on the right. This is because the resistors are"
                - emphasis [ref=e258]: resisting
                - text: the flow of electric charge being pushed by the battery. In other words, the “push” exerted by the resistors
                - emphasis [ref=e259]: against
                - text: the flow of electric charge
                - emphasis [ref=e260]: must
                - text: be in a direction opposite the source of electromotive force.
              - paragraph [ref=e261]: "Here we see what a digital voltmeter would indicate across each component in this circuit, black lead on the left and red lead on the right, as laid out in horizontal fashion:"
              - paragraph [ref=e262]
              - paragraph [ref=e263]
              - paragraph [ref=e264]
              - paragraph [ref=e265]:
                - text: If we were to take that same voltmeter and read voltage across combinations of components, starting with the only R
                - subscript [ref=e266]: "1"
                - text: "on the left and progressing across the whole string of components, we will see how the voltages add algebraically (to zero):"
              - paragraph [ref=e267]
              - paragraph:
                - img "Voltmeter and voltages add algebraically (to zero)"
              - paragraph [ref=e268]
              - paragraph [ref=e269]:
                - text: The fact that series voltages add up should be no mystery, but we notice that the
                - emphasis [ref=e270]: polarity
                - text: of these voltages makes a lot of difference in how the figures add. While reading voltage across R
                - subscript [ref=e271]: "1"
                - text: —R
                - subscript [ref=e272]: "2"
                - text: ", and R"
                - subscript [ref=e273]: "1"
                - text: —R
                - subscript [ref=e274]: "2"
                - text: —R
                - subscript [ref=e275]: "3"
                - text: (I’m using a “double-dash” symbol “—” to represent the
                - emphasis [ref=e276]: series
                - text: connection between resistors R
                - subscript [ref=e277]: "1"
                - text: ", R"
                - subscript [ref=e278]: "2"
                - text: ", and R"
                - subscript [ref=e279]: "3"
                - text: ), we see how the voltages measure successively larger (albeit negative) magnitudes, because the polarities of the individual voltage drops are in the same orientation (positive left, negative right).
              - paragraph [ref=e280]:
                - text: The sum of the voltage drops across R
                - subscript [ref=e281]: "1"
                - text: ", R"
                - subscript [ref=e282]: "2"
                - text: ", and R"
                - subscript [ref=e283]: "3"
                - text: equals 45 volts, which is the same as the battery’s output, except that the battery’s polarity is opposite that of the resistor voltage drops (negative left, positive right), so we end up with 0 volts measured across the whole string of components.
              - paragraph [ref=e284]:
                - text: That we should end up with exactly 0 volts across the whole string should be no mystery, either. Looking at the circuit, we can see that the far left of the string (left side of R
                - subscript [ref=e285]: "1"
                - text: ": point number 2) is directly connected to the far right of the string (right side of battery: point number 2), as necessary to complete the circuit."
              - paragraph [ref=e286]:
                - text: Since these two points are directly connected, they are
                - emphasis [ref=e287]: electrically common
                - text: to each other. And, as such, the voltage between those two electrically common points
                - emphasis [ref=e288]: must
                - text: be zero.
              - heading "Demonstrating Kirchhoff’s Voltage Law in a Parallel Circuit" [level=3] [ref=e289]
              - paragraph [ref=e290]:
                - text: Kirchhoff’s Voltage Law (sometimes denoted as
                - emphasis [ref=e291]: KVL
                - text: for short) will work for
                - emphasis [ref=e292]: any
                - text: "circuit configuration at all, not just simple series. Note how it works for this parallel circuit:"
              - paragraph [ref=e293]
              - paragraph:
                - img "parallel resistor circuit"
              - paragraph [ref=e294]
              - paragraph [ref=e295]: "Being a parallel circuit, the voltage across every resistor is the same as the supply voltage: 6 volts. Tallying up voltages around loop 2-3-4-5-6-7-2, we get:"
              - paragraph [ref=e296]
              - paragraph:
                - img "parallel circuit sample 1"
              - paragraph [ref=e297]
              - paragraph [ref=e298]:
                - text: Note how I label the final (sum) voltage as E
                - subscript [ref=e299]: 2-2
                - text: . Since we began our loop-stepping sequence at point 2 and ended at point 2, the algebraic sum of those voltages will be the same as the voltage measured between the same point (E
                - subscript [ref=e300]: 2-2
                - text: ), which of course must be zero.
              - heading "The Validity of Kirchhoff’s Voltage Law, Regardless of Circuit Topology" [level=3] [ref=e301]
              - paragraph [ref=e302]: "The fact that this circuit is parallel instead of series has nothing to do with the validity of Kirchhoff’s Voltage Law. For that matter, the circuit could be a “black box”—its component configuration completely hidden from our view, with only a set of exposed terminals for us to measure the voltage between—and KVL would still hold true:"
              - paragraph [ref=e303]
              - paragraph:
                - img "validity of kirchoffs voltage law regardless of circuit topology"
              - paragraph [ref=e304]:
                - text: Try any order of steps from any terminal in the above diagram, stepping around back to the original terminal, and you’ll find that the algebraic sum of the voltages
                - emphasis [ref=e305]: always
                - text: equals zero.
              - paragraph [ref=e306]: "Furthermore, the “loop” we trace for KVL doesn’t even have to be a real current path in the closed-circuit sense of the word. All we have to do to comply with KVL is to begin and end at the same point in the circuit, tallying voltage drops and polarities as we go between the next and the last point. Consider this absurd example, tracing “loop” 2-3-6-3-2 in the same parallel resistor circuit:"
              - paragraph [ref=e307]
              - paragraph:
                - img "kirchoffs voltage law in parallel circuit"
              - paragraph [ref=e308]
              - paragraph:
                - img "parallel resistor circuit sample"
              - heading [level=4] [ref=e309]
              - heading "Using Kirchhoff’s Voltage Law in a Complex Circuit" [level=4] [ref=e310]
              - paragraph [ref=e311]: "KVL can be used to determine an unknown voltage in a complex circuit, where all other voltages around a particular “loop” are known. Take the following complex circuit (actually two series circuits joined by a single wire at the bottom) as an example:"
              - paragraph [ref=e312]
              - paragraph:
                - img "kirchoffs voltage law in a complex circuit"
              - paragraph [ref=e313]
              - paragraph [ref=e314]:
                - text: To make the problem simpler, I’ve omitted resistance values and simply given voltage drops across each resistor. The two series circuits share a common wire between them (wire 7-8-9-10), making voltage measurements
                - emphasis [ref=e315]: between
                - text: "the two circuits possible. If we wanted to determine the voltage between points 4 and 3, we could set up a KVL equation with the voltage between those points as the unknown:"
              - paragraph [ref=e316]
              - paragraph:
                - img "kirchoffs voltage law equation"
              - paragraph [ref=e317]
              - paragraph:
                - img "kirchoffs voltage law diagram 7"
              - paragraph [ref=e318]
              - paragraph:
                - img "kirchoffs voltage law diagram 3"
              - paragraph [ref=e319]
              - paragraph:
                - img "kirchoffs voltage law diagram 4"
              - paragraph [ref=e320]
              - paragraph:
                - img "kirchoffs voltage law diagram 5"
              - paragraph [ref=e321]
              - paragraph [ref=e322]: Stepping around the loop 3-4-9-8-3, we write the voltage drop figures as a digital voltmeter would register them, measuring with the red test lead on the point ahead and black test lead on the point behind as we progress around the loop. Therefore, the voltage from point 9 to point 4 is a positive (+) 12 volts because the “red lead” is on point 9 and the “black lead” is on point 4.
              - paragraph [ref=e323]: The voltage from point 3 to point 8 is a positive (+) 20 volts because the “red lead” is on point 3 and the “black lead” is on point 8. The voltage from point 8 to point 9 is zero, of course, because those two points are electrically common.
              - paragraph [ref=e324]: "Our final answer for the voltage from point 4 to point 3 is a negative (-) 32 volts, telling us that point 3 is actually positive with respect to point 4, precisely what a digital voltmeter would indicate with the red lead on point 4 and the black lead on point 3:"
              - paragraph [ref=e325]
              - paragraph:
                - img "kirchoffs voltage law diagram 6"
              - paragraph [ref=e326]
              - paragraph [ref=e327]:
                - text: In other words, the initial placement of our “meter leads” in this KVL problem was “backward.” Had we generated our KVL equation starting with E
                - subscript [ref=e328]: 3-4
                - text: instead of E
                - subscript [ref=e329]: 4-3
                - text: ", stepping around the same loop with the opposite meter lead orientation, the final answer would have been E"
                - subscript [ref=e330]: 3-4
                - text: "= +32 volts:"
              - paragraph [ref=e331]
              - paragraph:
                - img "kirchoffs voltage law diagram 2"
              - paragraph [ref=e332]
              - paragraph [ref=e333]: "It is important to realize that neither approach is “wrong.” In both cases, we arrive at the correct assessment of voltage between the two points, 3 and 4: point 3 is positive with respect to point 4, and the voltage between them is 32 volts."
              - paragraph [ref=e334]
              - paragraph [ref=e335]:
                - strong [ref=e336]: "REVIEW:"
              - list [ref=e337]:
                - listitem [ref=e338]:
                  - text: "Kirchhoff’s Voltage Law (KVL):"
                  - emphasis [ref=e339]: “The algebraic sum of all voltages in a loop must equal zero”
              - paragraph [ref=e340]:
                - strong [ref=e341]: "RELATED WORKSHEETS:"
