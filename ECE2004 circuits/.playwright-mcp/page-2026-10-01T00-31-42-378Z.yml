            - heading "What is the Difference Between Series and Parallel Circuits?" [level=1] [ref=e220]
            - separator [ref=e221]
            - separator [ref=e222]
            - generic [ref=e223]:
              - img "What are Series and Parallel Circuits?" [ref=e225]
              - generic [ref=e226]:
                - heading "What are Series and Parallel Circuits?" [level=3] [ref=e227]
                - paragraph
                - paragraph [ref=e228]: In a series circuit, all components are connected end-to-end to form a single path for current flow. In a parallel circuit, all components are connected across each other with exactly two electrically common nodes with the same voltage across each component.
                - paragraph
            - generic [ref=e229]:
              - paragraph [ref=e230]:
                - text: Circuits consisting of just one
                - link "battery" [ref=e231] [cursor=pointer]:
                  - /url: https://www.allaboutcircuits.com/textbook/direct-current/chpt-11/battery-construction/
                - text: and one load
                - link "resistance" [ref=e232] [cursor=pointer]:
                  - /url: https://www.allaboutcircuits.com/textbook/direct-current/chpt-1/resistance/
                - text: are very simple to analyze, but they are not often found in practical applications. Usually, we find circuits where more than two components are connected together.
              - paragraph [ref=e233]:
                - text: "There are two fundamental ways in which to connect more than two circuit components:"
                - link "series" [ref=e234] [cursor=pointer]:
                  - /url: https://www.allaboutcircuits.com/video-lectures/series-circuits-part-1/
                - text: and
                - link "parallel" [ref=e235] [cursor=pointer]:
                  - /url: https://www.allaboutcircuits.com/video-lectures/parallel-circuits/
                - text: . These two basic connection methods can be combined to create more complex
                - link "series-parallel circuits" [ref=e236] [cursor=pointer]:
                  - /url: https://www.allaboutcircuits.com/textbook/direct-current/chpt-7/what-is-a-series-parallel-circuit/
                - text: .
              - paragraph [ref=e237]
              - heading "What is a Series Connection?" [level=3] [ref=e238]
              - paragraph [ref=e239]:
                - text: The definition of a
                - link "series circuit" [ref=e240] [cursor=pointer]:
                  - /url: https://www.allaboutcircuits.com/textbook/direct-current/chpt-5/simple-series-circuits/
                - text: is a circuit where the components are connected end-to-end in a line as illustrated in Figure 1.
              - paragraph [ref=e241]
              - paragraph [ref=e242]:
                - img "Series connection of resistors" [ref=e243]
              - heading [level=5] [ref=e244]:
                - emphasis [ref=e245]:
                  - strong [ref=e246]: Figure 1.
                  - text: Series connection of resistors
              - paragraph [ref=e247]
              - paragraph [ref=e248]:
                - text: These series
                - link "resistors" [ref=e249] [cursor=pointer]:
                  - /url: https://www.allaboutcircuits.com/video-lectures/electronic-components-resistors/
                - text: form a single path through which current can flow.
              - paragraph [ref=e250]
              - heading "Introduction to Series Circuits—A Series Circuit Example" [level=3] [ref=e251]
              - paragraph [ref=e252]: "Now, let’s examine an example of a series circuit as shown in Figure 2:"
              - paragraph [ref=e253]
              - paragraph [ref=e254]:
                - img "Example of a series circuit." [ref=e255]
              - heading [level=5] [ref=e256]:
                - emphasis [ref=e257]:
                  - strong [ref=e258]: Figure 2.
                  - text: An example of a series circuit.
              - paragraph [ref=e259]
              - paragraph [ref=e260]:
                - text: Here, we have three resistors (labeled R
                - subscript [ref=e261]: "1"
                - text: ", R"
                - subscript [ref=e262]: "2"
                - text: ", and R"
                - subscript [ref=e263]: "3"
                - text: ) connected in a long chain from one battery terminal to the other. Each resistor in a series circuit shares one electrical node with its nearest neighbor.
              - paragraph [ref=e264]
              - blockquote [ref=e265]:
                - paragraph [ref=e266]: "Note: The subscript labels—those little numbers to the lower-right of the letter “R”—are unrelated to the resistor values in ohms. They serve only to identify one resistor from another."
              - paragraph [ref=e267]
              - paragraph [ref=e268]: A series circuit’s defining characteristic is that all components in a series circuit have the same current flowing through them. There is only one path for the current to flow. In the circuit from Figure 2, the current (I) flows clockwise to complete a full loop from the positive battery terminal back to the negative terminal and then through the battery following the path 1–2–3–4–1.
              - paragraph [ref=e269]
              - heading "What Is a Parallel Connection?" [level=3] [ref=e270]
              - paragraph [ref=e271]:
                - text: The definition of a
                - link "parallel circuit" [ref=e272] [cursor=pointer]:
                  - /url: https://www.allaboutcircuits.com/textbook/direct-current/chpt-5/simple-parallel-circuits/
                - text: is a circuit where all components are connected across each other’s leads as shown in Figure 3.
              - paragraph [ref=e273]
              - paragraph [ref=e274]:
                - img "An example of a parallel connection of resistors." [ref=e275]
              - heading [level=5] [ref=e276]:
                - emphasis [ref=e277]:
                  - strong [ref=e278]: Figure 3.
                  - text: An example of a parallel connection of resistors.
              - paragraph [ref=e279]
              - paragraph [ref=e280]: In a purely parallel circuit, there are never more than two sets of electrically common points, no matter how many components are connected. There are many paths for current flow, but only one voltage across all components.
              - paragraph [ref=e281]
              - heading "Introduction to Parallel Circuits—A Parallel Circuit Example" [level=3] [ref=e282]
              - paragraph [ref=e283]: Let’s look at an example of a parallel circuit as shown in Figure 4.
              - paragraph [ref=e284]
              - paragraph [ref=e285]:
                - img "Example of a parallel circuit." [ref=e286]
              - heading [level=5] [ref=e287]:
                - emphasis [ref=e288]:
                  - strong [ref=e289]: Figure 4.
                  - text: Example of a parallel circuit.
              - paragraph [ref=e290]
              - paragraph [ref=e291]: "Again, we have three resistors, but this time there are three loops for the current to flow from the positive battery terminal back to the negative terminal:"
              - list [ref=e292]:
                - listitem [ref=e293]: 1–2–7–8–1
                - listitem [ref=e294]: 1–2–3–6–7–8–1
                - listitem [ref=e295]: 1–2–3–4–5–6–7–8–1
              - paragraph [ref=e296]:
                - text: Each individual path through R
                - subscript [ref=e297]: "1"
                - text: ", R"
                - subscript [ref=e298]: "2"
                - text: ", and R"
                - subscript [ref=e299]: "3"
                - text: (2–7, 3–6, and 4–5) is called a branch.
              - paragraph [ref=e300]: A parallel circuit’s defining characteristic is that all components are connected between the same set of electrically common points. Looking at the schematic diagram from Figure 4, we see that points 1, 2, 3, and 4 are all electrically common; so are points 5, 6, 7, and 8. All of the resistors, as well as the battery, are connected between these two sets of points. This means that the same voltage (V) is dropped across all components in a parallel circuit.
              - paragraph [ref=e301]
              - heading "Series vs Parallel Circuit Review:" [level=3] [ref=e302]
              - list [ref=e303]:
                - listitem [ref=e304]: In a series circuit, all components are connected end-to-end, forming a single path for current flow.
                - listitem [ref=e305]: In a parallel circuit, all components are connected across each other, forming exactly two sets of electrically common points.
                - listitem [ref=e306]: A “branch” in a parallel circuit is a path for electric current formed by one of the load components (such as a resistor).
              - paragraph [ref=e307]
              - heading "Series, Parallel, and Series-parallel Circuit Related Content:" [level=3] [ref=e308]
