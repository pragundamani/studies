                      - generic [ref=f74e250]: "Electricity: Capacitors"
                      - generic [ref=f74e252]: Capacitors are combinations of electrical conductors, separated in the circuit. Thus, they represent a "break" in the circuit. If the conductors carry equal but opposite charges, a potential difference exists across them. Although the conductors in a capacitor are separated, they do not interrupt current flow. Instead, their inclusion changes the way in which currents and potential differences are characterized in circuits.
                    - generic [ref=f74e254]:
                      - generic [ref=f74e255]: Part 1 of 6 - Step 1
                      - generic [ref=f74e258]:
                        - generic [ref=f74e259]: In a capacitor, two equally but oppositely charged conductors, typically thin plates, are separated by a distance, creating an electric field between them. The figure below shows two parallel plates in a capacitor, and the electric field due to the charge on the plates.
