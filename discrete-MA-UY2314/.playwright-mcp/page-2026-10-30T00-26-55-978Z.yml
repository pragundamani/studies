                      - generic [ref=f66e241]: "Electricity: Capacitors"
                      - generic [ref=f66e243]: Capacitors are combinations of electrical conductors, separated in the circuit. Thus, they represent a "break" in the circuit. If the conductors carry equal but opposite charges, a potential difference exists across them. Although the conductors in a capacitor are separated, they do not interrupt current flow. Instead, their inclusion changes the way in which currents and potential differences are characterized in circuits.
                    - generic [ref=f66e245]:
                      - generic [ref=f66e246]: Part 1 of 6 - Step 1
                      - generic [ref=f66e249]:
