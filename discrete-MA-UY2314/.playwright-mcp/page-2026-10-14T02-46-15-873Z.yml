                      - generic [ref=f5e637]:
                        - paragraph [ref=f5e638]: "Dear Students, Here’s some information about Exam 1:"
                        - list [ref=f5e639]:
                          - listitem [ref=f5e640]: Exam 1 will take place in our usual classroom, during our usual class time on Wednesday, September 30, 2026.
                          - listitem [ref=f5e641]: Exam 1 is 110 minutes long.
                          - listitem [ref=f5e642]: Theorem 2.1.1 and Table 2.3.1 will be provided. Otherwise, no additional resources will be provided nor allowed.
                          - listitem [ref=f5e643]:
                            - text: No notes, no calculators, and no electronic devices. Any such items or equipment found with the power on will be interpreted as
                            - emphasis [ref=f5e644]: cheating
                            - text: .
                          - listitem [ref=f5e645]:
                            - text: During the exam, all your electronic devices must be
                            - emphasis [ref=f5e646]: turned off
                            - text: ", deposited in your bag, and your bag"
                            - emphasis [ref=f5e647]: underneath
                            - text: your seat or desk.
                          - listitem [ref=f5e648]: We recommend you use a pencil, in case you need to erase your writing, but no pencil cases are allowed on your desk during the exam.
                          - listitem [ref=f5e649]: Have only your NYU ID and writing utensil(s) on your desk during the exam.
                          - listitem [ref=f5e650]: If you need scrap paper or extra space to write during the exam, use the back of the pages of the exam. Additional paper is neither provided nor allowed.
                          - listitem [ref=f5e651]: If you leave the exam room without permission or unsupervised, you will be submitting your exam and can no longer work on it.
                          - listitem [ref=f5e652]: The exam will include the material we covered based on textbook sections 2.1, 2.2, 2.3, 3.1, 3.2, 3.3, and 3.4. So the first 2 exercises on Gradescope Homework 3 represent the cutoff in new topics.
                        - paragraph [ref=f5e653]: We encourage you all to read the syllabus for additional info regarding the exam and its format. The quizzes, class participation, office hours, the exam review, and honest efforts on the exercises provide excellent preparation for the exam, as there is neither a practice exam nor a guarantee of review in class prior to the exam.
                        - paragraph [ref=f5e654]: If you have exam accommodations with the Moses Center for Student Accessibility, be sure to register to sit for exam with the Moses Center as soon as possible, via the Moses CSA online portal.
                        - paragraph [ref=f5e655]: Best,The Discrete Math Team
